services:
  postgres:
    image: postgres:16-alpine
    container_name: collaborative-todo-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collaborative_todo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collaborative-todo-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/collaborative_todo?schema=public
      JWT_SECRET: super-secret-key-change-me-in-production
      JWT_EXPIRATION: 24h
      PORT: 3000
      FRONTEND_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collaborative-todo-frontend
    restart: unless-stopped
    ports:
      # Map 3001 on host to 3000 in container (Next.js default)
      - "3001:3000"
    environment:
      # URL to reach backend from client-side code
      NEXT_PUBLIC_WS_URL: http://localhost:3000/collaboration
    depends_on:
      - backend

volumes:
  postgres_data:
